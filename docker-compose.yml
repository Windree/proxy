services:

  xray:
    restart: unless-stopped
    build: xray/image
    env_file: .env
    volumes:
      - ./data/xray:/data
      - ./data/log/xray:/data/log
    ports:
      - ${XRAY_PORT}:443/tcp
    command: "run -config /data/xray.json"
    networks:
      - network1
    depends_on:
      tor-windree:
        condition: service_started
      tor-kassberke:
        condition: service_started
      tor-yasha:
        condition: service_started
      tor-j:
        condition: service_started
      configuration-generator:
        condition: service_completed_successfully

  configuration-generator:
    restart: none
    build: configuration-generator/image
    volumes:
      - ./data-xray:/data/template
      - ./data/xray:/data/configuration
    command: 
      - "--data-file=/data/configuration/data.json"
      - "/data/template/xray.json.j2"
      - "/data/configuration/xray.json"
      - "--on-start=echo configuration generation started"
      - "--on-completed=echo configuration generated successfully"
      - "--on-error=echo Unable to generate output due an error"
      - "--on-empty=echo No data to generate output"
      - "--on-exit=echo Exiting"

###########
### TOR ###
###########
  tor-windree:
    restart: unless-stopped
    build: tor/image
    tmpfs:
      - /root/.tor:size=100663296 # ~46MB * 2
    env_file: .env
    volumes:
      - ./data/tor-windree:/data
    networks:
      - network1
    ports:
      - ${WINDREE_TOR_PORT}:9050/tcp
      - ${WINDREE_OR_PORT}:9001/tcp
    healthcheck:
      test: [ "CMD", "/entrypoint", "healthcheck" ]
      start_period: ${HEATHCHECK_DELAY}
      interval: 2m
      timeout: 10s
      retries: 1

  tor-kassberke:
    restart: unless-stopped
    build: tor/image
    tmpfs:
      - /root/.tor:size=100663296 # ~46MB * 2
    env_file: .env
    volumes:
      - ./data/tor-kassberke:/data
    networks:
      - network1
    ports:
      - ${KASSBERKE_TOR_PORT}:9050/tcp
    healthcheck:
      test: [ "CMD", "/entrypoint", "healthcheck" ]
      start_period: ${HEATHCHECK_DELAY}
      interval: 2m
      timeout: 10s
      retries: 1

  tor-yasha:
    restart: unless-stopped
    build: tor/image
    tmpfs:
      - /root/.tor:size=100663296 # ~46MB * 2
    env_file: .env
    volumes:
      - ./data/tor-yasha:/data
    networks:
      - network1
    ports:
      - ${YASHA_TOR_PORT}:9050/tcp
    healthcheck:
      test: [ "CMD", "/entrypoint", "healthcheck" ]
      start_period: ${HEATHCHECK_DELAY}
      interval: 2m
      timeout: 10s
      retries: 1

  tor-j:
    restart: unless-stopped
    build: tor/image
    tmpfs:
      - /root/.tor:size=100663296 # ~46MB * 2
    env_file: .env
    environment:
      - TOR_EXIT_NODES="{us}"
    volumes:
      - ./data/tor-j:/data
    networks:
      - network1
    ports:
      - ${J_TOR_PORT}:9050/tcp
    healthcheck:
      test: [ "CMD", "/entrypoint", "healthcheck" ]
      start_period: ${HEATHCHECK_DELAY}
      interval: 2m
      timeout: 10s
      retries: 1

networks:
  network1:
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: ${SUBNET}
